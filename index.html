<style>

    --accent-ink:#ffffff;
    --accent-soft:#efeafb;

<Script>
/* ---------- Artwork: inline SVG badges ---------- */
function hashColorPair(key){
  // simple deterministic hash → hues
  let h=0; for(let i=0;i<key.length;i++) h=(h*31 + key.charCodeAt(i))>>>0;
  const hue1 = h % 360, hue2 = (h*7)%360;
  return [`hsl(${hue1} 70% 55%)`,`hsl(${hue2} 65% 45%)`];
}
function AnimalSVGById(id, title){
  const [c1,c2]=hashColorPair(id);
  const label = (title||id||'?').split(' ')[0];
  return `
  <div class="thumb">
    <svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label} artwork">
      <defs>
        <linearGradient id="bg-${id}" x1="0" x2="1">
          <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
        </linearGradient>
      </defs>
      <rect width="640" height="360" rx="18" fill="url(#bg-${id})"/>
      <!-- abstract animal silhouette: ear + head + nose -->
      <circle cx="350" cy="160" r="90" fill="rgba(0,0,0,.12)"/>
      <circle cx="415" cy="120" r="40" fill="rgba(0,0,0,.10)"/>
      <circle cx="312" cy="190" r="26" fill="rgba(0,0,0,.16)"/>
      <!-- wave -->
      <path d="M0,260 C140,220 220,320 360,290 C480,266 560,320 640,300 L640,360 L0,360 Z" fill="rgba(0,0,0,.18)"/>
      <text x="28" y="56" font-family="Inter,system-ui,Arial" font-weight="700" font-size="34" fill="rgba(255,255,255,.92)">${label}</text>
    </svg>
  </div>`;
}
// Bump when image files change — busts the 7-day immutable cache (see server/app.js)
const IMG_VERSION = '2';
function animalImageUrl(id){
  if(!id) return null;
  // images/<animal-id>.webp  (e.g., images/gray_squirrel.webp)
  return `images/${id}.webp?v=${IMG_VERSION}`;
}

// Fallback: if an animal PNG is missing/broken, swap in the generated SVG art
// instead of showing a broken-image icon. Runs in global scope from onerror.
function AnimalImgFallback(img){
  if(img.dataset.fellBack) return; // guard against loops
  img.dataset.fellBack = '1';
  const box = img.closest('.thumb, .hero-thumb, .zoo-mini') || img.parentNode;
  if(box) box.innerHTML = AnimalSVGById(img.dataset.animalId, img.dataset.animalTitle);
}

function AnimalCardArt(id, title, variant){
  const safeId = id || 'unknown';
  const label = (title || safeId || 'Inner animal').replace(/"/g,'&quot;');
  const url = animalImageUrl(safeId);
  const cls = variant === 'hero' ? 'thumb hero-thumb' : 'thumb';
  return `
    <div class="${cls}">
      <img src="${url}" alt="${label} illustration" loading="lazy" decoding="async"
           data-animal-id="${safeId}" data-animal-title="${label}"
           onerror="AnimalImgFallback(this)"/>
    </div>`;
}

/* ---------- Utility ---------- */
function locomotionToRealm(locomotions){const s=new Set(locomotions||[]); if(s.has('flyer')||s.has('glider')) return 'air'; if(s.has('swimmer')||s.has('diver')) return 'water'; return 'land';}
// rarityBias now lives in quiz_logic.js (loaded above).
// Display order in The Zoo
const RARITY_BUCKETS = ['Common','Uncommon','Unique','Bizarre'];
const REALM_LABELS = { land:'Land', air:'Air', water:'Water' };

/* ---------- Zoo Helper Functions ----------
   flattenTraits and flattenFacets now live in quiz_logic.js (loaded above). */

// UI state for The Zoo (expand/collapse, paging, search, add-animal flow)
const ZooState = {
  search: '',
  // Start all closed
  realmOpen: { land:false, air:false, water:false },
  // Start all buckets closed
  bucketOpen: {
    land:  { Common:false, Uncommon:false, Unique:false, Bizarre:false },
    air:   { Common:false, Uncommon:false, Unique:false, Bizarre:false },
    water: { Common:false, Uncommon:false, Unique:false, Bizarre:false }
  },
  // Pages track independently
  page: {
    land:  { Common:0, Uncommon:0, Unique:0, Bizarre:0 },
    air:   { Common:0, Uncommon:0, Unique:0, Bizarre:0 },
    water: { Common:0, Uncommon:0, Unique:0, Bizarre:0 }
  }
};
window.ZooState = ZooState;

const ZooHandlers = {
  searchInput(value) {
    ZooState.search = value || '';
  },

  searchSubmit(input) {
    const val = (input && input.value || '').trim();
    ZooState.search = val;
    
    // If searching, open everything so results are visible
    if (val) {
      ['land','air','water'].forEach(r => {
        ZooState.realmOpen[r] = true;
        RARITY_BUCKETS.forEach(b => ZooState.bucketOpen[r][b] = true);
      });
    }
    App.nav('zoo');
  },

  toggleRealm(target) {
    // 1. Determine if we are opening or closing the target
    const isOpening = !ZooState.realmOpen[target];
    
    // 2. Force CLOSE all realms first (Accordion behavior)
    ['land','air','water'].forEach(r => ZooState.realmOpen[r] = false);

    // 3. Set the target state
    ZooState.realmOpen[target] = isOpening;

    // Optional: When closing a realm, you might want to reset its buckets?
    // For now, we leave bucket states alone so they remember where you were.
    App.nav('zoo');
  },

  toggleBucket(realm, targetBucket) {
    // 1. Determine if we are opening or closing the target
    const isOpening = !ZooState.bucketOpen[realm][targetBucket];

    // 2. Force CLOSE all buckets in this specific realm
    RARITY_BUCKETS.forEach(b => ZooState.bucketOpen[realm][b] = false);

    // 3. Set the target state
    ZooState.bucketOpen[realm][targetBucket] = isOpening;
    App.nav('zoo');
  },

  page(realm, bucket, delta) {
    // Ensure we are targeting a specific nested key
    if(!ZooState.page[realm]) ZooState.page[realm] = {};
    const current = ZooState.page[realm][bucket] || 0;
    ZooState.page[realm][bucket] = Math.max(0, current + delta);
    App.nav('zoo');
  }
};

// Persistent storage for users/results
const STORAGE_KEY = 'innerAnimal.app.v10';
const LEGACY_KEY  = 'inner-animal-v2';

const Store = {
  load() {
    try {
      // Prefer the current key
      let raw = localStorage.getItem(STORAGE_KEY);

      // If nothing stored yet, try legacy key once and migrate
      if (!raw) {
        const legacyRaw = localStorage.getItem(LEGACY_KEY);
        if (legacyRaw) {
          const legacyParsed = JSON.parse(legacyRaw);
          const migrated = {
            users: legacyParsed.users || {},
            currentUser: legacyParsed.currentUser || null
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
          return migrated;
        }
        return { users: {}, currentUser: null };
      }

      const parsed = JSON.parse(raw) || {};
      if (!parsed.users || typeof parsed.users !== 'object') {
        parsed.users = {};
      }
      if (!('currentUser' in parsed)) {
        parsed.currentUser = null;
      }
      return parsed;
    } catch (err) {
      console.warn('Store.load failed:', err);
      return { users: {}, currentUser: null };
    }
  },

  save(state) {
    try {
      const payload = {
        users: state.users || {},
        currentUser: state.currentUser || null
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch (err) {
      console.warn('Store.save failed:', err);
    }
  }
};

/* ---------- Core App ---------- */
const App={
  state:Object.assign({},Store.load(),{view:'home'}),
  
  nav(t){
    this.state.view=t;
    document.querySelectorAll('nav button').forEach(b=>{b.classList.remove('active');b.removeAttribute('aria-current');});
    const btn=document.getElementById('nav-'+t);
    if(btn){btn.classList.add('active');btn.setAttribute('aria-current','page');}
    
    // Switch the hero banner style
    this.updateBanner(t);

    this.render();
  },
  
  updateBanner(viewName){
    const banner = document.getElementById('main-banner');
    if(!banner) return;
    
    // Reset to base, then add the view-specific modifier
    // Supported views: home, quiz, hall, zoo, users, about
    // Fallback: use 'home' if viewName is unknown or results
    let target = viewName;
    if(target === 'results') target = 'results'; // We have a results style now, or use 'quiz'
    
    // Remove all modifier classes first? Easier to just set className directly
    // preserving the 'hero-banner' base class
    banner.className = `hero-banner ${target}`;

    // Fill the banner with per-view hero content (title + tagline)
    const META = {
      home:   {h:`What's your <span class="accent">inner animal?</span>`, p:'A free 2-minute personality quiz · 130 animals · no sign-up', pills:true},
      quiz:   {h:'The Quiz', p:'Short visual choices reveal your archetype.'},
      hall:   {h:'The Hall', p:'Every inner animal, ready to meet.'},
      zoo:    {h:'The Zoo', p:'All 130 inner animals across land, air, and water.'},
      users:  {h:'Community', p:'See who has found their inner animal.'},
      about:  {h:'About', p:'How Inner Animal works.'},
      results:{h:'Your reveal', p:'Meet your inner animal.'},
    };
    const m = META[target] || META.home;
    banner.removeAttribute('role');
    banner.setAttribute('aria-label', 'Inner Animal');
    banner.innerHTML = `
      <div class="hero-inner">
        <h2>${m.h}</h2>
        <p>${m.p}</p>
        ${m.pills ? `<div class="hero-pills"><span class="pill">Land</span><span class="pill">Air</span><span class="pill">Water</span></div>` : ''}
      </div>`;
  },

  setUser(u){
    const s=this.state;
    if(!s.users[u]) s.users[u]={username:u,results:[]};
    s.currentUser=u;
    Store.save(s);
    this.render();
  },

  deleteUser(u){
    if(!confirm(`Are you sure you want to delete user "${u}" and all their results?`)) return;
    const s=this.state;
    if(s.users[u]){
      delete s.users[u];
      // If we deleted the active user, log them out
      if(s.currentUser === u){
        s.currentUser = null;
      }
      Store.save(s);
      this.render();
    }
  },
  
  logout(){this.state.currentUser=null;Store.save(this.state);this.render();},
  
  startQuiz(){this.quiz=new QuizRunner();this.nav('quiz');},
  
  finishQuiz(r){
    const s=this.state;
    if(!s.currentUser) return;
    const rec=Object.assign({chosen_kind:'top'},r,{ts:Date.now()});
    s.users[s.currentUser].results.unshift(rec);
    Store.save(s);
    this.nav('results');
  },

  /* --- SWAP LOGIC (Fixes Dropping Animals) --- */

  // 1. Swap Top <-> Alternate (Same Quiz)
  swapActiveAlternate(idx){
    const s=this.state, u=s.users[s.currentUser];
    if(!u||!u.results.length) return;
    const r=u.results[0];
    
    if(!r.alternates || !r.alternates[idx]) return;

    const newTop = r.alternates[idx];
    const oldTop = r.top;

    // Ensure confidence travels with the animal
    if(oldTop.confidence === undefined) oldTop.confidence = r.confidence || 0;

    r.top = newTop;
    r.alternates[idx] = oldTop;
    r.chosen_kind = 'top';
    r.ts = Date.now();
    
    // Update wrapper confidence to match the new winner
    r.confidence = newTop.confidence || 0;
    
    Store.save(s);
    this.render();
  },

  // 2. Swap Top <-> Shadow (Same Quiz)
  swapActiveShadow(){
    const s=this.state, u=s.users[s.currentUser];
    if(!u||!u.results.length) return;
    const r=u.results[0];
    if(!r.shadow) return;

    const newTop = r.shadow;
    const oldTop = r.top;

    if(oldTop.confidence === undefined) oldTop.confidence = r.confidence || 0;

    r.top = newTop;
    r.shadow = oldTop;
    r.chosen_kind = 'top';
    r.ts = Date.now();
    
    r.confidence = newTop.confidence || 0;

    Store.save(s);
    this.render();
  },

  // 3. Swap Top <-> History (Preserves Pack!)
  promoteHistory(index){
    const s=this.state;
    const u=s.users[s.currentUser];
    if(!u || index <= 0 || index >= u.results.length) return;

    const activeRec = u.results[0];
    const histRec = u.results[index];

    // Identify the animals
    const newTop = histRec.top;
    const oldTop = activeRec.top;

    // Ensure confidence is attached to the animal objects before moving them
    if(oldTop.confidence === undefined) oldTop.confidence = activeRec.confidence || 0;
    if(newTop.confidence === undefined) newTop.confidence = histRec.confidence || 0;

    // SWAP: History animal becomes Active Top. Old Top goes to History.
    // This keeps the Active Record's alternates/shadows intact!
    activeRec.top = newTop;
    histRec.top = oldTop;

    // Update timestamps and confidence wrappers
    activeRec.ts = Date.now();
    activeRec.confidence = newTop.confidence;
    histRec.confidence = oldTop.confidence;
    
    Store.save(s);
    this.render();
  },

  /* --- DELETE LOGIC (Direct) --- */

  deleteActiveAlternate(idx){
    const s=this.state, u=s.users[s.currentUser];
    if(u && u.results && u.results[0] && u.results[0].alternates) {
      u.results[0].alternates.splice(idx, 1);
      Store.save(s);
      this.render();
    }
  },

  deleteActiveShadow(){
    const s=this.state, u=s.users[s.currentUser];
    if(u && u.results && u.results[0]) {
      u.results[0].shadow = null;
      Store.save(s);
      this.render();
    }
  },

  deleteResult(index){ 
    const s=this.state; 
    const u=s.users[s.currentUser]; 
    if(!u) return; 
    
    if(index < 0 || index >= u.results.length) return;

    u.results.splice(index,1); 
    Store.save(s); 
    this.render(); 
  },

  render(){
    const root=document.getElementById('app'),s=this.state;
    // Re-trigger the view-enter animation on each navigation
    root.classList.remove('view-enter'); void root.offsetWidth; root.classList.add('view-enter');
    if(s.view==='home') return Views.home(root,s);
    if(s.view==='quiz') return Views.quiz(root,this);
    if(s.view==='results') return Views.results(root,s);
    if(s.view==='hall') return Views.hall(root,s);
    if(s.view==='zoo') return Views.zoo(root,s);
    if(s.view==='users') return Views.users(root,s);
    if(s.view==='about') return Views.about(root,s);
  }
};

function laneBadge(l){const map={common:'Familiar',less_common:'Less-common',unusual:'Unusual',bizarre:'Bizarre'}; return `<span class="pill">${map[l]||l}</span>`;}
function ResultCard(result){
  const t=(result&&result.top)||{};
  const traits=Array.isArray(t.traits)?t.traits:[];
  
  // Get confidence from the Animal object first
  const rawConf = (t.confidence !== undefined) ? t.confidence : (result.confidence || 0);
  const conf = Math.round(rawConf * 100);
  
  const bar=`<div class="progress" style="height:6px;margin-top:6px">
    <div style="width:${conf}%;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--good),var(--accent));"></div>
  </div>`;
  return (
    `<div class="card">`+
      AnimalCardArt(t.id||'unknown', t.name||'', 'hero')+
      `<h3 class="big">${t.name||'Unknown'}</h3>`+
      `<div class="traits">${traits.map(x=>`<span class='pill'>${x}</span>`).join('')}</div>`+
      `<div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;">`+
        `<div>${laneBadge(t.lane||'common')}</div>`+
        `<div class="small" style="font-weight:600;color:var(--accent2)">${conf}% Match</div>`+
      `</div>`+
      bar+
      `<div class="muted small" style="margin-top:8px">Saved ${new Date(result.ts||Date.now()).toLocaleString()}</div>`+
    `</div>`
  );
}

function ResultMiniCard(an){
  if(!an) return '<div class="muted small">None</div>';
  const rec = (an.top && an.top.name) ? an.top : an;
  const traits = Array.isArray(rec.traits) ? rec.traits : [];
  const lane = rec.lane || (an.rarity_lane||'common');
  const name = rec.name || an.display_name || 'Unknown';
  
  // Get confidence
  const val = (rec.confidence !== undefined) ? rec.confidence : (an.confidence || 0);
  const conf = Math.round(val * 100);
  
  // Show pill if we have data
  const confPill = conf > 0 ? `<span class='pill' style='background:#111827;border-color:var(--accent);color:var(--accent)'>${conf}%</span>` : '';
  
  return (
    `<div class="card">`+
      AnimalCardArt(rec.id||an.id||'unknown', name, 'mini')+
      `<h4>${name}</h4>`+
      `<div class="traits">${traits.map(x=>`<span class='pill'>${x}</span>`).join('')}</div>`+
      `<div style="margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">${laneBadge(lane)} ${confPill}</div>`+
    `</div>`
  );
}

        </div>`;
    };

    const realmSections = ['land','air','water'].map(realm=>{
      const openRealm = ZooState.realmOpen[realm];

      const header = `
        <div class="zoo-section-header" data-realm="${realm}" onclick="ZooHandlers.toggleRealm('${realm}')">
          <h3>${REALM_LABELS[realm]}</h3>
          <button type="button" class="btn small btn-icon" aria-expanded="${openRealm}" aria-label="${openRealm?'Collapse':'Expand'} ${REALM_LABELS[realm]} animals">${openRealm ? '−' : '+'}</button>
        </div>`;

      if(!openRealm) return `<section class="zoo-section">${header}</section>`;

      const cols = RARITY_BUCKETS.map(bucket=>{
        const animals = groups[realm][bucket] || [];
        const total = animals.length;
        const openBucket = ZooState.bucketOpen[realm][bucket];

        const headerRow = `
          <div class="zoo-bucket-header" onclick="ZooHandlers.toggleBucket('${realm}','${bucket}')">
            <h4>${bucket}</h4>
            <span class="muted small">${total}</span>
            <button type="button" class="btn small btn-icon">${openBucket ? '−' : '+'}</button>
          </div>`;

        if(!openBucket) return `<div class="card">${headerRow}</div>`;

        // --- PAGINATION LOGIC ---
        const pageSize = 9;
        const sorted = animals.slice().sort((a,b)=>(a.display_name||a.id).localeCompare(b.display_name||b.id));
        const totalPages = Math.max(1, Math.ceil(sorted.length / pageSize));
        
        let pageIndex = ZooState.page[realm][bucket] || 0;
        if(pageIndex >= totalPages) pageIndex = totalPages - 1;
        if(pageIndex < 0) pageIndex = 0;
        ZooState.page[realm][bucket] = pageIndex;

        const start = pageIndex * pageSize;
        const slice = sorted.slice(start, start + pageSize);

        const cardsHtml = slice.length
          ? slice.map(makeAnimalCard).join('')
          : `<div class="muted small">No animals in this lane yet.</div>`;

        const prevDisabled = pageIndex === 0;
        const nextDisabled = pageIndex >= totalPages - 1;

        const pager = totalPages > 1 ? `
          <div class="zoo-pager small">
            <button type="button" class="btn small"
              ${prevDisabled ? 'disabled style="opacity:0.5;cursor:default;"' : ''}
              onclick="ZooHandlers.page('${realm}','${bucket}',-1)">Prev 9</button>
            
            <span>Page ${pageIndex+1} of ${totalPages}</span>
            
            <button type="button" class="btn small"
              ${nextDisabled ? 'disabled style="opacity:0.5;cursor:default;"' : ''}
              onclick="ZooHandlers.page('${realm}','${bucket}',1)">Next 9</button>
          </div>` : '';

        return `
          <div class="card">
            ${headerRow}
            <div class="zoo-cards">${cardsHtml}</div>
            ${pager}
          </div>`;
      }).join('');

      return `<section class="zoo-section">${header}<div class="zoo-grid">${cols}</div></section>`;
    }).join('');

    el.innerHTML = `
      <section class="panel">
        <div class="zoo-controls">
          <div class="zoo-search">
            <input id="zoo-search-input" type="text" placeholder="Search..." value="${ZooState.search||''}"
              oninput="ZooHandlers.searchInput(this.value)"
              onkeydown="if(event.key==='Enter'){ ZooHandlers.searchSubmit(this); }"
            />
          </div>
          <button type="button" class="btn primary small" onclick="ZooHandlers.searchSubmit(document.getElementById('zoo-search-input'))">Search</button>
        </div>
        ${statsHtml}
        ${realmSections}
      </section>`;
  },
  users(el,s){
    const rows=Object.values(s.users).map(u=>`
      <div class="card" onclick="App.setUser('${u.username}'); (App.state.users['${u.username}'].results.length?App.nav('results'):App.nav('quiz'))">
        ${AnimalSVGById('user-'+u.username, '@'+u.username)}
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h4>@${u.username}</h4>
          <div class="muted small">${u.results.length} result(s)</div>
        </div>
        <div class="traits">${ (u.results[0]?.top?.traits||[]).map(t=>`<span class='pill'>${t}</span>`).join('') || '<span class="muted small">No traits yet.</span>' }</div>
      </div>`).join('');
    el.innerHTML=`<section class="panel"><h2 class="big">Users</h2><div class="row cols-3">${rows||'<div class="muted">No users.</div>'}</div></section>`;
  },
  about(el){ el.innerHTML=`
    <section class="panel">
      <h2 class="big">About</h2>
      <p class="muted">Version 1.0 adds a modern, low-glow look and inline SVG artwork for the logo and animals. The quiz keeps lane-specific prompts, a tie-break step for close matches, a Familiar ↔ Surprising slider with snapping, progress counter, 0.6/0.4 scoring, and a confidence meter. After results, you can choose Top / Near Miss / Shadow as your saved Inner Animal.</p>
    </section>`; }
};
/* ---------- Quiz + Scoring ---------- */

function lerp(a,b,t){return a*(1-t)+b*t;}


/* ---------- Question views ---------- */

function TriadView(triad,onPick,onBack,onSkip,selectedIndex){
  const wrap=document.createElement('div');
  const prompt=document.createElement('div'); prompt.className='big'; prompt.textContent=triad.prompt; wrap.appendChild(prompt);
  const row=document.createElement('div'); row.className='row cols-3'; wrap.appendChild(row);
  (triad.options||[]).forEach((opt,i)=>{
    const card=document.createElement('button'); card.type='button'; card.className='opt'; if(selectedIndex===i){card.classList.add('selected'); card.setAttribute('aria-pressed','true');}
    const art=document.createElement('div'); art.innerHTML=AnimalSVGById(triad.id+'-'+i, opt.label); card.appendChild(art.firstElementChild);
    const h4=document.createElement('h4'); h4.textContent=opt.label; card.appendChild(h4);
    card.addEventListener('click',()=>onPick && onPick(opt,i)); row.appendChild(card);
  });
  const controls=document.createElement('div'); controls.className='controls';
  const left=document.createElement('div'); const right=document.createElement('div'); controls.appendChild(left); controls.appendChild(right);
  const back=document.createElement('button'); back.className='btn'; back.textContent='Back';
  back.addEventListener('click',()=>{ if(onBack) onBack(); });
  left.appendChild(back);
  const skip=document.createElement('button'); skip.className='btn'; skip.textContent='Skip';
  skip.addEventListener('click',()=>{ if(onSkip) onSkip(); });
  right.appendChild(skip);
  wrap.appendChild(controls);
  return wrap;
}

function TieBreakView(onPick){
  const wrap=document.createElement('div');
  const head=document.createElement('h3'); head.textContent='Tie-breaker'; wrap.appendChild(head);
  const sub=document.createElement('div'); sub.className='muted small'; sub.textContent='One more nudge to separate close matches.'; wrap.appendChild(sub);
  const row=document.createElement('div'); row.className='row cols-3'; wrap.appendChild(row);
  const options=[
    {label:'Precision & Patience', trait_boosts:{signature:['precision','patience']}},
    {label:'Bold & Fast', trait_boosts:{temperament:['bold'], signature:['speed','agility']}},
    {label:'Creative & Adaptable', trait_boosts:{signature:['creativity'], temperament:['adaptable']}}
  ];
  options.forEach((opt,i)=>{const card=document.createElement('button'); card.type='button'; card.className='opt';
    const art=document.createElement('div'); art.innerHTML=AnimalSVGById('tiebreak-'+i, opt.label); card.appendChild(art.firstElementChild);
    const h4=document.createElement('h4'); h4.textContent=opt.label; card.appendChild(h4);
    card.addEventListener('click',()=>onPick(opt)); row.appendChild(card);});
  return wrap;
}

/* ---------- Quiz Runner ---------- */
class QuizRunner{
  constructor(){
    this.stageA=TRIADS.filter(t=>t.stage==='A');
    this.baseB=TRIADS.filter(t=>t.stage==='B');
    this.laneB=[];
    this.aIndex=0; this.bIndex=0;
    this.userFacets={biome:new Set(),locomotion:new Set(),diel:new Set(),sociality:new Set(),diet:new Set()};
    this.userTraits={}; this.slider=50; this._tiebroke=false; this.selectionsA=new Array(this.stageA.length).fill(null); this.selectionsB=[];
    this.lanePick=null;
  }
  inStageB(){ return this.aIndex>=this.stageA.length; }
  boostFromOption(opt){ this.addOptionBoost(opt); }
  addOptionBoost(opt){
    for(const k in (opt?.trait_boosts||{})) (opt.trait_boosts[k]||[]).forEach(tr=>this.userTraits[tr]=(this.userTraits[tr]||0)+1);
    for(const k in (opt?.facet_boosts||{})) (opt.facet_boosts[k]||[]).forEach(f=>this.userFacets[k]?.add(f));
  }
  recompute(){
    this.userFacets={biome:new Set(),locomotion:new Set(),diel:new Set(),sociality:new Set(),diet:new Set()};
    this.userTraits={};
    for(let i=0;i<Math.min(this.aIndex,this.stageA.length);i++){
      const idx=this.selectionsA[i]; if(idx==null) continue; const tri=this.stageA[i]; const opt=tri?.options?.[idx]; if(opt) this.addOptionBoost(opt);
    }
    const SB=this.getStageB();
    for(let i=0;i<Math.min(this.bIndex,SB.length);i++){
      const idx=this.selectionsB[i]; if(idx==null) continue; const tri=SB[i]; const opt=tri?.options?.[idx]; if(opt) this.addOptionBoost(opt);
    }
  }
  getStageB(){ return [...(this.baseB||[]), ...(this.laneB||[])]; }
  buildLaneUI(){
    const scores={land:0,air:0,water:0};
    if(this.userFacets.locomotion.has('flyer')||this.userFacets.locomotion.has('glider')) scores.air+=2;
    if(this.userFacets.locomotion.has('swimmer')||this.userFacets.locomotion.has('diver')) scores.water+=2;
    if(this.userFacets.locomotion.size===0) scores.land+=1;
    [...this.userFacets.biome].forEach(b=>{
      if(['coastal','reef','open_ocean','river_lake','wetland'].includes(b)) scores.water+=1;
      if(['forest','grassland/savanna','desert','urban','alpine/tundra'].includes(b)) scores.land+=1;
    });
    const lanes=Object.entries(scores).sort((a,b)=>b[1]-a[1]).map(([k,_])=>k).slice(0,3);
    const wrap=document.createElement('div'); wrap.className='panel';
    const title=document.createElement('h3'); title.textContent='Choose your lane'; wrap.appendChild(title);
    const sub=document.createElement('p'); sub.className='muted small'; sub.textContent='This helps us focus the shortlist.'; wrap.appendChild(sub);
    const row=document.createElement('div'); row.className='lane-pick'; wrap.appendChild(row);
    lanes.forEach(l=>{const card=document.createElement('button'); card.type='button'; card.className='opt'; card.style.flex='1';
      card.style.borderTop='3px solid '+(({land:'var(--land)',air:'var(--air)',water:'var(--water)'})[l]||'var(--accent)');
      const art=document.createElement('div'); art.innerHTML=AnimalSVGById('lane-'+l, l[0].toUpperCase()+l.slice(1)); card.appendChild(art.firstElementChild);
      const h4=document.createElement('h4'); h4.textContent=l[0].toUpperCase()+l.slice(1); card.appendChild(h4);
      const d=document.createElement('div'); d.className='muted small'; d.textContent='Focus on '+l+' species'; card.appendChild(d);
      card.addEventListener('click',()=>this.chooseLane(l)); row.appendChild(card);});
    return wrap;
  }
  chooseLane(l){
    this.lanePick=l; this.laneB=(LANE_TRIADS&&LANE_TRIADS[l])?LANE_TRIADS[l]:[]; this.selectionsB=[]; this.bIndex=0; this.recompute();
    if(this.renderInto){
      const laneSlot=this.renderInto.querySelector('#laneSlot'); if(laneSlot) laneSlot.innerHTML='';
      const bSlot=this.renderInto.querySelector('#bSlot'); if(bSlot) bSlot.style.display='block';
    }
    this.renderB();
  }
  updateCounters(){
    if(!this.renderInto) return;
    const total=(this.stageA?.length||0)+(this.getStageB()?.length||0);
    const aDone=Math.min(this.aIndex,this.stageA.length);
    const bDone=Math.min(this.bIndex,this.getStageB().length);
    const answered=Math.min(aDone+bDone,total);
    const current=Math.min(answered+1,total);
    const line=this.renderInto.querySelector('#countLine');
    if(line) line.textContent=`Q ${current}/${total} · A ${aDone}/${this.stageA.length} · B ${bDone}/${this.getStageB().length}`;
    const pA=this.renderInto.querySelector('#progA'); if(pA) pA.style.width=`${(this.aIndex/this.stageA.length)*50}%`;
    const pB=this.renderInto.querySelector('#progB'); if(pB) pB.style.width=`${50+(this.bIndex/this.getStageB().length)*50}%`;
  }
  render(){
    const wrap=document.createElement('section'); wrap.className='panel';
    wrap.innerHTML=`
      <div class="controls">
        <div class="pill">User: <strong>${App.state.currentUser||'—'}</strong></div>
        <div style="min-width:240px;flex:1;display:flex;flex-direction:column;gap:4px">
          <label id="biasLabel" for="biasRange" class="small muted" style="font-weight:600">Familiar ↔ Surprising</label>
          <div class="range-wrap">
            <input id="biasRange" type="range" min="0" max="100" value="${this.slider}" aria-labelledby="biasLabel" aria-valuetext="${this.slider<48?'Familiar':this.slider>52?'Surprising':'Neutral'}"/>
            <div class="ticks"><span>Familiar</span><span>Neutral</span><span>Surprising</span></div>
            <div id="biasCaption" class="small muted"></div>
          </div>
        </div>
      </div>
      <div class="progress" style="margin-top:12px"><div id="progA" style="width:${(this.aIndex/this.stageA.length)*50}%"></div></div>
      <div id="countLine" class="small muted right" style="margin-top:4px"></div>
      <h3 class="big">Stage A — Find your lane</h3>
      <div id="aSlot"></div>
      <div id="laneSlot"></div>
      <div id="bSlot" style="display:none">
        <div class="progress" style="margin-top:12px"><div id="progB" style="width:${50+(this.bIndex/this.getStageB().length)*50}%"></div></div>
        <h3 class="big">Stage B — Refine your traits</h3>
        <div id="bQ"></div>
      </div>`;
    const bias=wrap.querySelector('#biasRange'); const cap=wrap.querySelector('#biasCaption');
    function updateCaption(v){ if(!cap) return; cap.textContent=(v<48)?'Familiar':(v>52)?'Surprising':'Neutral'; }
    function snap(v){ return (v>=47 && v<=53)?50:v; }
    if(bias){
      updateCaption(this.slider);
      bias.addEventListener('input',(e)=>{ let v=+e.target.value; v=snap(v); if(v!==+e.target.value) e.target.value=v; this.slider=v; updateCaption(v); this.updateCounters(); });
    }
    this.renderInto=wrap; this.recompute(); this.renderA(); this.updateCounters(); return wrap;
  }
  renderA(){
    const slot=this.renderInto.querySelector('#aSlot');
    if(this.aIndex>=this.stageA.length){
      slot.innerHTML='<div class="muted">Stage A complete.</div>';
      const laneSlot=this.renderInto.querySelector('#laneSlot'); if(laneSlot){ laneSlot.innerHTML=''; laneSlot.appendChild(this.buildLaneUI()); }
      return;
    }
    slot.innerHTML=''; const triad=this.stageA[this.aIndex];
    const selectedIdx=this.selectionsA[this.aIndex];
    slot.appendChild(TriadView(triad,(opt,i)=>{ this.selectionsA[this.aIndex]=i; this.aIndex++; this.recompute(); this.updateCounters(); this.renderA(); }, ()=>{ if(this.aIndex>0){ this.aIndex--; this.recompute(); this.updateCounters(); this.renderA(); } }, ()=>{ this.selectionsA[this.aIndex]=null; this.aIndex++; this.recompute(); this.updateCounters(); this.renderA(); }, selectedIdx));
  }
  renderB(){
    const slot=this.renderInto.querySelector('#bQ');
    const SB=this.getStageB();
    if(this.bIndex>=SB.length){
      let prelim=computeShortlist(this.userTraits,this.userFacets,this.slider,this.lanePick);
      if((prelim.margin||0)<0.03 && !this._tiebroke){
        this._tiebroke=true; slot.innerHTML=''; slot.appendChild(TieBreakView((opt)=>{ this.addOptionBoost(opt); const final=computeShortlist(this.userTraits,this.userFacets,this.slider,this.lanePick); App.finishQuiz(final);}));
        return;
      }
      App.finishQuiz(prelim); return;
    }
    slot.innerHTML=''; const triad=SB[this.bIndex];
    const selectedIdx=this.selectionsB[this.bIndex];
    slot.appendChild(TriadView(triad,(opt,i)=>{ this.selectionsB[this.bIndex]=i; this.bIndex++; this.recompute(); this.updateCounters(); this.renderB(); }, ()=>{ if(this.bIndex>0){ this.bIndex--; this.recompute(); this.updateCounters(); this.renderB(); } else { this.lanePick=null; this.laneB=[]; const bSlot=this.renderInto.querySelector('#bSlot'); if(bSlot) bSlot.style.display='none'; const laneSlot=this.renderInto.querySelector('#laneSlot'); if(laneSlot){ laneSlot.innerHTML=''; laneSlot.appendChild(this.buildLaneUI()); } this.updateCounters(); } }, ()=>{ this.selectionsB[this.bIndex]=null; this.bIndex++; this.recompute(); this.updateCounters(); this.renderB(); }, selectedIdx));
  }
}
/* ---------- Boot ---------- */
window.App = App;
App.nav(App.state.view || 'home');
</script>
